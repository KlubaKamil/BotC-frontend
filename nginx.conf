server {
  listen 80;
  listen [::]:80;
  server_name blood.kerbal.space www.blood.kerbal.space czachodym.ddns.net www.czachodym.ddns.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name blood.kerbal.space www.blood.kerbal.space;

  ssl_certificate /etc/letsencrypt/live/blood.kerbal.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blood.kerbal.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
      proxy_pass http://backend:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
  }
}

