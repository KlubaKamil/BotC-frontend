<mat-dialog-content style="max-width: 100%; max-height: 90vh"> 
    <div class="d-flex justify-content-between align-items-start align-items-lg-center"> 
        <label mat-dialog-title class="mat-headline-5" style="max-width: 50vw;">{{ data.message }}</label> 
        <button mat-fab color="secondary" (click)="close()" class="mt-3 me-3"> 
            <mat-icon>close</mat-icon> 
        </button> 
    </div> 
    <div *ngIf="editAvailable" class="d-flex justify-content-center row"> 
        <div class="m-4"> 
            <button mat-raised-button color="secondary" (click)="fileInput.click()" class="w-100"> Dodaj zdjęcia 
                <mat-icon iconPositionEnd>add_a_photo</mat-icon> 
            </button> 
        </div> 
    </div> 
    <div *ngIf="editAvailable && hasChanges" class="d-flex justify-content-center row">
        <div>
            <button mat-raised-button color="secondary" (click)="confirm()" class="w-100">
                Prześlij do zapisania
            </button>
        </div>
    </div>
    <input #fileInput type="file" accept="image/*" multiple hidden (change)="addImage($event)"/> 
    <div class="row d-flex" style="text-align: center; padding: 1rem;">
    <label *ngIf="selectedPreviews.length > 0" mat-dialog-title class="mat-headline-6">Zdjęcia do przesłania</label>
    <div *ngFor="let preview of selectedPreviews; let i = index" class="col-12 col-lg-6">
        <div style="position: relative; display: inline-block;">
            <img [src]="preview"
                alt="Preview image"
                style="max-width: 100%; max-height: 80vh; margin-bottom: 1rem;
                        border: 2px dashed #aaa; border-radius: 8px; padding: 4px; background: #fafafa;">

            <button mat-mini-fab color="warn"
                    style="position: absolute; top: 10px; right: 10px; z-index: 10;"
                    (click)="removePreview(i)">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
     
    <label *ngIf="editAvailable && uploadedImageNames.length > 0" mat-dialog-title class="mat-headline-6">Aktaulne zdjęcia</label>
    <div *ngFor="let imageName of uploadedImageNames; let i = index" class="col-12 col-lg-6">
        <div style="position: relative; display: inline-block;">
            <img [src]="apiUrl + '/game/' + this.group.id + '/' + this.gameId + '/image/' + imageName + '?t=' + timestamp"
                alt="Uploaded image"
                [ngStyle]="{
                'max-width': '100%',
                'max-height': '80vh',
                'margin-bottom': '1rem',
                'border-radius': '8px',
                'opacity': imagesToDelete.includes(imageName) ? '0.5' : '1',
                'border': imagesToDelete.includes(imageName) ? '2px solid red' : 'none'
                }">

            <button *ngIf="editAvailable" mat-mini-fab
                    [color]="imagesToDelete.includes(imageName) ? 'primary' : 'warn'"
                    style="position: absolute; top: 10px; right: 10px; z-index: 10;"
                    (click)="imagesToDelete.includes(imageName) ? 
                            imagesToDelete.splice(imagesToDelete.indexOf(imageName), 1) : 
                            markImageForDeletion(imageName)">
                <mat-icon>{{ imagesToDelete.includes(imageName) ? 'undo' : 'close' }}</mat-icon>
            </button>
        </div>
    </div>
</div>
</mat-dialog-content>
