<div class="main-container">
    <div class="slider-container" [class.show-detail]="detailsView">
      <div class="slide left">
        <app-players></app-players>
      </div>
      <div class="slide right">
        <app-player></app-player>
      </div>
    </div>
  
    <button mat-fab color="secondary" class="toggle-btn" (click)="toggleView()">
      <mat-icon>{{ detailsView ? 'arrow_back' : 'arrow_forward' }}</mat-icon>
    </button>
</div>
